version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    groups:
      runtime:
        patterns: ["streamlit", "pandas", "altair", "google-cloud-firestore"]
      tooling:
        patterns: ["black", "isort", "flake8", "mypy", "bandit", "pytest*", "pandas-stubs", "build", "twine"]
    labels: ["dependencies"]
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
